<script>
// camera pulse ease (profile [camera], legs with `bez`): CSS cubic-bezier(x1,y1,x2,y2), x solved by bisection
// (same math as layout.cubic_bezier)
window.__bez=function(b){return function(t){if(t<=0||t>=1)return Math.min(1,Math.max(0,t));
  const bx=u=>3*(1-u)*(1-u)*u*b[0]+3*(1-u)*u*u*b[2]+u*u*u;let lo=0,hi=1;
  for(let i=0;i<40;i++){const m=(lo+hi)/2;if(bx(m)<t)lo=m;else hi=m;}
  const u=(lo+hi)/2;return 3*(1-u)*(1-u)*u*b[1]+3*(1-u)*u*u*b[3]+u*u*u;};};
// a camera ease as a function: GSAP ease names resolve through gsap.parseEase, functions pass through
window.__ease=function(E){return typeof E==='function'?E:gsap.parseEase(E);};
// counter-scale ease of a camera leg (zoom a -> z under ease E, any ease): a tween of v/a -> v/z with this ease equals
// v / (camera scale of the same frame), so counter-scaled labels, heads, strokes and dashes keep their planned
// on-screen size on every frame of every leg
window.__inv=function(a,z,E){const e=window.__ease(E);if(Math.abs(z-a)<1e-9)return e;
  return function(p){return (1/(a+(z-a)*e(p))-1/a)/(1/z-1/a);};};
// camera legs, one definition for every block: leg k tweens the camera from the previous leg's end over frames
// [f0, f1) under `ease` (glide, whip = power3.inOut, drift = constant ln-rate zoom (rho^t-1)/(rho-1), pulse = base
// drift `lr` plus the cubic-bezier share; hyperframes.leg_ease is the same math); `inv` as above
window.__legs=function(C,FPS){
  const glide=t=>{t=Math.min(Math.max(t,0),1);return 0.35*t+0.65*(1-Math.cos(Math.PI*t))/2;};
  const quart=t=>t<0.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;   // GSAP power3.inOut
  const EASE={glide:glide,whip:quart};
  const legEase=(L,s0)=>{const rho=L.to.s/s0, flat=Math.abs(rho-1)<1e-9;
    if(!L.bez&&L.ease==='drift')return flat?(t=>t):(t=>(Math.pow(rho,t)-1)/(rho-1));
    const B=L.bez?window.__bez(L.bez):EASE[L.ease];
    if(flat||L.lr===undefined)return B;
    const ln=Math.log(rho), r=Math.sign(ln)*Math.min(Math.abs(L.lr),Math.abs(ln));
    return t=>(Math.exp(r*t+(ln-r)*B(t))-1)/(rho-1);};
  return C.legs.map((L,k)=>{const from=k?C.legs[k-1].to:C.start, ease=window.__ease(legEase(L,from.s));
    return {L:L,k:k,from:from,t0:L.f0/FPS,d:(L.f1-L.f0)/FPS,ease:ease,inv:window.__inv(from.s,L.to.s,ease)};});};
</script>
<script>
(function(){
const S=window.SCENE, FPS=S.fps, f2t=f=>f/FPS;
const rgba=(hex,a)=>'rgba('+[1,3,5].map(k=>parseInt(hex.slice(k,k+2),16)).join(',')+','+a+')';
const cam=document.getElementById('cam'), ui=document.getElementById('ui'), LG=S.legibility||null;

// covers both; each tile sits at its raster box scaled to map px; each image is its own layer, drawn from its own pixels

  d.style.cssText='position:absolute;left:0;top:0;width:'+S.map_size[0]+'px;height:'+S.map_size[1]+'px';
  im.replaceWith(d);d.appendChild(im);
  S.deep.forEach(t=>{const e=document.createElement('img'), kx=S.map_size[0]/t.raster[0], ky=S.map_size[1]/t.raster[1];
    e.src=t.img;e.setAttribute('data-deep','');
    e.style.cssText='position:absolute;left:'+(t.box[0]*kx)+'px;top:'+(t.box[1]*ky)+'px;width:'+((t.box[2]-t.box[0])*kx)+

  b.style.cssText='position:absolute;left:0;top:0;width:'+S.map_size[0]+'px;height:'+S.map_size[1]+'px';
  b.appendChild(document.getElementById('map'));cam.appendChild(b);return b;})():cam;

const legs=window.__legs(C,FPS);
legs.forEach(g=>tl.fromTo(cam,{x:g.from.x,y:g.from.y,scale:g.from.s},
  {x:g.L.to.x,y:g.L.to.y,scale:g.L.to.s,duration:g.d,ease:g.ease,immediateRender:g.k===0},g.t0));

  tw.style.cssText='position:absolute;left:0;top:0;width:'+S.width+'px;height:'+S.height+'px;transform-origin:50% 50%';
  cam.before(tw);tw.appendChild(cam);
  gsap.set(tw,{transformPerspective:C.tilt.p,rotationX:C.start.t});
  legs.forEach(g=>{if(g.from.t!==g.L.to.t)tl.fromTo(tw,{rotationX:g.from.t},
    {rotationX:g.L.to.t,transformPerspective:C.tilt.p,duration:g.d,ease:g.ease,immediateRender:false},g.t0);});}
// whip motion blur: an SVG Gaussian blur on the camera only strictly between a whip's first and last frame (half a
// frame inside, so both are sharp); deviations are in map pixels, so the on-screen blur is divided by the zoom
const whips=legs.filter(g=>g.L.blur);

  const NS='http://www.w3.org/2000/svg', svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width','0');svg.setAttribute('height','0');svg.style.position='absolute';
  svg.innerHTML='<filter id="mb" filterUnits="userSpaceOnUse" x="0" y="0" width="'+S.map_size[0]+'" height="'+S.map_size[1]+
    '" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0" edgeMode="duplicate"/></filter>';
  document.body.appendChild(svg);
  const fe=svg.querySelector('feGaussianBlur');
  whips.forEach(g=>{const z=(g.from.s+g.L.to.s)/2, b=(g.L.blur[0]/z)+' '+(g.L.blur[1]/z);
    const h=0.5/FPS, a=g.t0+h, m=g.t0+g.d/2, e=g.t0+g.d-h;
    tl.set(base,{filter:'url(#mb)'},a);
    tl.fromTo(fe,{attr:{stdDeviation:'0 0'}},{attr:{stdDeviation:b},duration:m-a,ease:'power2.in',immediateRender:false},a);
    tl.fromTo(fe,{attr:{stdDeviation:b}},{attr:{stdDeviation:'0 0'},duration:e-m,ease:'power2.out',immediateRender:false},m);
    tl.set(base,{filter:'none'},e);});
}
// region highlights: SVG in map pixels under the pins; the edge keeps its on-screen width while the camera zooms
if(S.regions&&S.regions.length){
  // legibility profiles: translucent fill, full-colour outline, no glow
  const NS='http://www.w3.org/2000/svg', svg=document.createElementNS(NS,'svg'),
    T=LG?Object.assign({},S.theme,{region_fill_opacity:LG.entity_fill_alpha,region_edge_px:LG.entity_outline_px,region_glow_px:0}):S.theme;
  svg.setAttribute('width',S.map_size[0]);svg.setAttribute('height',S.map_size[1]);svg.style.cssText='position:absolute;left:0;top:0;overflow:visible';
  base.appendChild(svg);
  S.regions.forEach((R,i)=>{
    const r=LG?Object.assign({},R,{edge:'glow'}):R;
    const pg=document.createElementNS(NS,'polygon');
    pg.setAttribute('points',r.points.map(p=>p[0]+','+p[1]).join(' '));
    pg.setAttribute('fill',r.colour);pg.setAttribute('fill-opacity','0');pg.setAttribute('stroke-linejoin','round');
    pg.setAttribute('stroke',r.edge==='glow'?r.colour:'#ffffff');pg.setAttribute('stroke-opacity','0');
    const soft=r.edge==='glow'&&T.region_glow_px>0&&T.region_glow_alpha<1, glow=rgba(r.colour,T.region_glow_alpha);
    // a full-strength glow filters the filled polygon; a softer glow sits on a stroke-only copy underneath, so the

    pg.setAttribute('data-entity',r.entity);pg.setAttribute('data-paint','fill');pg.setAttribute('data-region',i);
    const cased=LG&&LG.region_casing_px>0;
    if(LG){pg.setAttribute('data-line','region:'+i);lineInk(pg,cased?[r.colour,r.casing]:[r.colour]);}
    const edges=[pg];
    // legibility profiles: a casing in the outline's opposite tone (r.casing) under it (stroke only; the fill stays on the polygon)
    const cg=cased?document.createElementNS(NS,'polygon'):null;
    if(cased){cg.setAttribute('points',pg.getAttribute('points'));cg.setAttribute('fill','none');cg.setAttribute('stroke',r.casing);
      cg.setAttribute('stroke-opacity','0');cg.setAttribute('stroke-linejoin','round');cg.setAttribute('data-line-casing','region:'+i);svg.appendChild(cg);}
    if(soft){
      const ge=document.createElementNS(NS,'polygon');ge.setAttribute('points',pg.getAttribute('points'));
      ge.setAttribute('fill','none');ge.setAttribute('stroke',r.colour);ge.setAttribute('stroke-opacity','0');ge.setAttribute('stroke-linejoin','round');
      ge.style.filter='drop-shadow(0 0 '+T.region_glow_px+'px '+glow+') drop-shadow(0 0 '+(T.region_glow_px/3)+'px '+glow+')';
      svg.appendChild(ge);edges.push(ge);

    if(cased)tl.fromTo(cg,{attr:{'stroke-opacity':0}},{attr:{'stroke-opacity':1},duration:0.5,ease:'power2.out',immediateRender:true},t0);
    if(cased)legs.forEach(g=>tl.fromTo(cg,{attr:{'stroke-width':(T.region_edge_px+2*LG.region_casing_px)/g.from.s}},{attr:{'stroke-width':(T.region_edge_px+2*LG.region_casing_px)/g.L.to.s},duration:g.d,ease:g.inv,immediateRender:g.k===0},g.t0));
    if(soft)tl.fromTo(edges[1],{attr:{'stroke-opacity':0}},{attr:{'stroke-opacity':T.region_glow_alpha},duration:0.5,ease:'power2.out',immediateRender:true},t0);
    legs.forEach(g=>tl.fromTo(edges,{attr:{'stroke-width':T.region_edge_px/g.from.s}},{attr:{'stroke-width':T.region_edge_px/g.L.to.s},duration:g.d,ease:g.inv,immediateRender:g.k===0},g.t0));
  });
}
// routes: a dashed line revealed along its length by a solid mask stroke, an arrowhead riding the drawing tip; line,
// dashes and arrowhead keep their on-screen size while the camera zooms
if(S.routes&&S.routes.length){
  const NS='http://www.w3.org/2000/svg', T=S.theme, svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',S.map_size[0]);svg.setAttribute('height',S.map_size[1]);svg.style.cssText='position:absolute;left:0;top:0;overflow:visible';
  base.appendChild(svg);
  const mk=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);return e;};
  const dash=s=>(T.route_dash_px/s)+' '+(T.route_gap_px/s);
  S.routes.forEach((r,i)=>{
    const d='M'+r.points.map(q=>q[0]+' '+q[1]).join(' L');
    const mask=mk('mask',{id:'route-mask-'+i,maskUnits:'userSpaceOnUse',x:-S.map_size[0],y:-S.map_size[1],width:3*S.map_size[0],height:3*S.map_size[1]});
    const mp=mk('path',{d:d,fill:'none',stroke:'#fff','stroke-width':4*T.route_width_px,'stroke-linecap':'butt','stroke-linejoin':'round'});
    mask.appendChild(mp);svg.appendChild(mask);
    const g=mk('g',{'data-route':i});g.style.filter='drop-shadow(0 2px 3px rgba(0,0,0,.6))';
    const line=mk('path',{d:d,fill:'none',stroke:T.route_colour,'stroke-width':T.route_width_px/C.start.s,'stroke-dasharray':dash(C.start.s),
      'stroke-linecap':'round','stroke-linejoin':'round',mask:'url(#route-mask-'+i+')'});
    const a=T.route_arrow_px, head=mk('g',{}), sc=mk('g',{transform:'scale('+(1/C.start.s)+')'});
    sc.appendChild(mk('polygon',{points:'0,0 '+(-a)+','+(-0.55*a)+' '+(-0.72*a)+',0 '+(-a)+','+(0.55*a),fill:T.route_colour}));

    const cw=LG?T.route_width_px+2*LG.route_casing_px:0, casing=LG?line.cloneNode():null;
    if(LG){casing.setAttribute('stroke',LG.route_casing_colour);casing.setAttribute('stroke-width',cw/C.start.s);g.appendChild(casing);
      const hp=sc.firstChild;hp.setAttribute('stroke',LG.route_casing_colour);hp.setAttribute('stroke-width',2*LG.route_casing_px);
      hp.setAttribute('stroke-linejoin','round');hp.setAttribute('paint-order','stroke');}
    head.appendChild(sc);g.appendChild(line);g.appendChild(head);svg.appendChild(g);
    if(LG){g.setAttribute('data-line','route:'+i);lineInk(g,[T.route_colour,LG.route_casing_colour]);}
    const L=mp.getTotalLength(), t0=f2t(r.at_frame), pr={p:0};
    mp.setAttribute('stroke-dasharray',L+' '+L);

      mp.setAttribute('stroke-dashoffset',L*(1-pr.p));head.setAttribute('transform','translate('+q.x+' '+q.y+') rotate('+ang+')');};
    draw();head.style.opacity=0;
    tl.fromTo(head,{opacity:0},{opacity:1,duration:0.15,ease:'none',immediateRender:true},t0);
    tl.fromTo(pr,{p:0},{p:1,duration:r.draw_s,ease:'power1.inOut',onUpdate:draw,immediateRender:true},t0);
    legs.forEach(gl=>{
      tl.fromTo(line,{attr:{'stroke-width':T.route_width_px/gl.from.s,'stroke-dasharray':dash(gl.from.s)}},
        {attr:{'stroke-width':T.route_width_px/gl.L.to.s,'stroke-dasharray':dash(gl.L.to.s)},duration:gl.d,ease:gl.inv,immediateRender:gl.k===0},gl.t0);
      if(LG)tl.fromTo(casing,{attr:{'stroke-width':cw/gl.from.s,'stroke-dasharray':dash(gl.from.s)}},
        {attr:{'stroke-width':cw/gl.L.to.s,'stroke-dasharray':dash(gl.L.to.s)},duration:gl.d,ease:gl.inv,immediateRender:gl.k===0},gl.t0);
      tl.fromTo(sc,{attr:{transform:'scale('+(1/gl.from.s)+')'}},{attr:{transform:'scale('+(1/gl.L.to.s)+')'},duration:gl.d,ease:gl.inv,immediateRender:gl.k===0},gl.t0);
    });
  });
}
// legibility profiles: basemap chroma muted while regions or routes are on screen

  if(ov.length)tl.fromTo(document.getElementById('map'),{filter:'saturate(1)'},{filter:'saturate('+LG.basemap_chroma+')',duration:0.5,ease:'power2.out',immediateRender:true},f2t(Math.min(...ov)));}

const TH=S.theme, root=document.getElementById('root');
root.style.setProperty('--pin',TH.pin_colour);

const TXT_SHADOW='0 '+TH.text_shadow_dy_px+'px '+TH.text_shadow_blur_px+'px rgba(0,0,0,'+TH.text_shadow_alpha+')';
if(TH.text_outline_px>0){
  root.classList.add('legible');
  root.style.setProperty('--txt-outline-px',TH.text_outline_px+'px');
  root.style.setProperty('--txt-outline',rgba(TH.text_outline_colour,TH.text_outline_alpha));
  root.style.setProperty('--txt-shadow',TXT_SHADOW);

      tl.set(lab,place(pos),e[0]);

});
// area labels: region names inside their polygon, keeping their on-screen size while the camera zooms
const cam=q('#cam');
(LY.areas||[]).forEach(a=>{
  const el=document.createElement('div');el.className='pin';el.style.left=a.anchor[0]+'px';el.style.top=a.anchor[1]+'px';
  el.style.visibility='visible';
  el.innerHTML='<div class="pb"><div class="lw" style="position:absolute;left:0;top:0"><div class="beside" data-qa="area:'+a.key+'"></div></div></div>';
  const lab=el.querySelector('.beside'), lw=el.querySelector('.lw'), pb=el.querySelector('.pb');
  lab.textContent=a.text;
  lab.style.cssText+=";left:0;top:0;font-family:'EngTitle',EngInter,sans-serif;font-size:"+a.px+'px;letter-spacing:'+a.tracking+'em'+(a.water?';font-style:italic':'');
  if(window.__adapt)window.__adapt.el(lab,'area:'+a.key,S.legibility.halo_width_em);
  gsap.set(lab,{xPercent:-50,yPercent:-50,rotation:a.angle});
  cam.appendChild(el);
  legs.forEach(g=>tl.fromTo(pb,{scale:1/g.from.s},{scale:1/g.L.to.s,duration:g.d,ease:g.inv,immediateRender:g.k===0},g.t0));
  show(lw,LY.els['area:'+a.key],'label');
});
// Z1: the title and the data card at their grid positions
const T=q('[data-qa="title"]');
if(T){kill(T);
  if(LY.title){gsap.set(T,{xPercent:0,scale:1,left:LY.title.x,top:LY.title.y,fontSize:LY.title.px+'px',visibility:'visible'});show(T,LY.els['title:0'],'title');}
  else gsap.set(T,{visibility:'hidden'});
}
(S.figures||[]).forEach((F,i)=>{const el=q('[data-qa="figure:'+i+'"]');if(!el)return;kill(el);
  const P=LY.figures[String(i)];
  if(!P){gsap.set(el,{visibility:'hidden'});return;}
  gsap.set(el,{xPercent:0,yPercent:0,scale:1,left:P.x,top:P.y,fontSize:P.px+'px',fontVariantNumeric:'lining-nums tabular-nums',visibility:'visible'});
  show(el,LY.els['fig:'+i],'figure');
});
if(window.__adapt)window.__adapt.up();
})();
</script>
<script>
// print block (profile [print], video_engine/printstyle.py): type roles, map grade, regions as printed ink, date
// headings, hand notes and the emboss of place names. Runs after the layout block; sets fonts, blend modes and the
// grade, and adds the heading and note elements (positions and times from S.layout).
(function(){
const S=window.SCENE, P=S.print, LY=S.layout, LG=S.legibility;
if(!P||!LY||!LG)return;
const tl=window.__timelines.main, q=s=>document.querySelector(s), FPS=S.fps, C=S.camera, paper=P.surface==='paper';
const NS='http://www.w3.org/2000/svg', A=window.__adapt;
const rgba=(hex,a)=>'rgba('+[1,3,5].map(k=>parseInt(hex.slice(k,k+2),16)).join(',')+','+a+')';
const FAM={inter:'EngInter,sans-serif',serif:"'EngSerif',serif",garamond:"'EngGaramond',serif",
  garamond_italic:"'EngGaramondI',serif",cinzel:"'EngCinzel',serif",hand:"'EngHand',cursive"};
const font=(el,role,w,trk,caps)=>{el.style.fontFamily=FAM[role];el.style.fontWeight=w;if(role==='garamond_italic')el.style.fontStyle='normal';
  if(trk!==null&&trk!==undefined)el.style.letterSpacing=trk+'em';if(caps)el.style.textTransform='uppercase';};
const legs=window.__legs(C,FPS);
const fades=(el,spans)=>{gsap.set(el,{opacity:0});(spans||[]).forEach((s,j)=>{
  tl.fromTo(el,{opacity:0},{opacity:1,duration:Math.max(s[1],1e-3),ease:'power2.out',immediateRender:j===0},s[0]);
  if(s[2]!==null)tl.fromTo(el,{opacity:1},{opacity:0,duration:Math.max(s[3],1e-3),ease:'power1.in',immediateRender:false},s[2]);});};
const base=q('#base'), map=q('#map'), shade=q('#shade'), cam=q('#cam'), ui=q('#ui');
const BLEND=[];   // [el, text el]: multiply on paper, normal while the knock-back vignette is up
// grade (paper): static saturation and contrast, the paper texture and grain multiplied over the map, a light vignette
if(paper){
  tl.getTweensOf(map).forEach(tw=>{if('filter' in (tw.vars||{}))tw.kill();});
  map.style.filter='saturate('+P.grade_saturate+') contrast('+P.grade_contrast+')';
  if(P.paper_texture&&P.paper_alpha>0){const t=document.createElement('div');t.setAttribute('data-grade','paper');
    t.style.cssText='position:absolute;left:0;top:0;width:'+S.map_size[0]+'px;height:'+S.map_size[1]+'px;background:url("assets/'+
      P.paper_texture+'") repeat;background-size:512px 512px;mix-blend-mode:multiply;opacity:'+P.paper_alpha+';pointer-events:none';
    map.after(t);}
  if(P.grain&&P.grain_alpha>0){const g=document.createElement('div');g.setAttribute('data-grade','grain');
    g.style.cssText='position:absolute;inset:0;background:url("assets/'+P.grain+'") repeat;mix-blend-mode:multiply;opacity:'+P.grain_alpha+';pointer-events:none';
    (q('#tilt')||cam).after(g);}
  shade.style.background='radial-gradient(ellipse at 50% 50%,'+rgba(P.ink,0)+' 55%,'+rgba(P.ink,P.vignette_alpha)+' 100%)';
}
// regions: solid edge in the entity's ink (no casing), fill multiplied into the paper; normal blend on dark maps
document.querySelectorAll('polygon[data-region]').forEach(pg=>{const R=S.regions[+pg.getAttribute('data-region')];
  pg.setAttribute('stroke',rgba(R.edge_ink,P.region_edge_alpha));pg.setAttribute('data-line-ink',JSON.stringify([R.edge_ink]));
  if(paper&&P.region_multiply)pg.ownerSVGElement.style.mixBlendMode='multiply';});
const R=P.roles;
// pin labels: print role (the leader follows the ink)
S.pins.forEach((p,i)=>{const lab=q('[data-qa="pin:'+i+'"]');if(lab)font(lab,...R.label);});
// place names and the scene title: inside their region, entry tracking tightening, emboss under the ink on paper
const ghosts=[];
(LY.areas||[]).forEach(a=>{const lab=q('[data-qa="area:'+a.key+'"]');if(!lab)return;
  const k=a.title?'title':'area';font(lab,a.role||R[k][0],a.weight||R[k][1],a.tracking,true);
  const lw=lab.parentElement, pb=lw.parentElement, el=pb.parentElement;
  if(a.tracking_in!==undefined)(LY.els['area:'+a.key]||[]).forEach(s=>tl.fromTo(lab,{letterSpacing:a.tracking_in+'em'},
    {letterSpacing:a.tracking+'em',duration:Math.max(s[1],1e-3),ease:'power2.out',immediateRender:false},s[0]));
  gsap.set(lab,{letterSpacing:(a.tracking_in!==undefined?a.tracking_in:a.tracking)+'em'});
  if(paper){BLEND.push([pb,lab]);
    if(P.emboss_alpha>0){const g=el.cloneNode(true);g.querySelectorAll('[data-qa],[data-ink],[data-line]').forEach(n=>{
        n.removeAttribute('data-qa');n.removeAttribute('data-ink');n.removeAttribute('data-line');n.classList.remove('adapt');});
      g.setAttribute('data-ink-ghost','emboss');el.before(g);
      ghosts.push({src:[pb,lw,lab],dst:[g.querySelector('.pb'),g.querySelector('.lw'),g.querySelector('.beside')]});}}
});
// year and time: print roles, centred by the layout
(S.figures||[]).forEach((F,i)=>{const el=q('[data-qa="figure:'+i+'"]'), Pf=LY.figures[String(i)];if(!el||!Pf)return;
  const time=Pf.tracking!==undefined;
  font(el,(time?R.time:R.year)[0],Pf.weight,time?Pf.tracking:0,time);
  if(paper)BLEND.push([el,el]);else if(!time&&A)A.shadow(el,[4,12,0.35]);});
// date headings: caps between two rules drawn from the centre outwards, a diamond at each inner end
(LY.headings||[]).forEach(h=>{
  const el=document.createElement('div');el.className='heading';el.setAttribute('data-qa','heading:'+h.key);el.textContent=h.text;
  el.style.cssText='position:absolute;white-space:nowrap;line-height:1;left:'+h.x+'px;top:'+h.y+'px;font-size:'+h.px+'px';
  font(el,...R.heading);ui.appendChild(el);
  if(A){A.el(el,'heading:'+h.key,LG.halo_width_em);if(!paper)A.shadow(el,[2,6,P.heading_shadow_alpha]);}
  const sp=LY.els['heading:'+h.key]||[], d=P.diamond_px, g=P.rule_gap;
  fades(el,sp);if(paper)BLEND.push([el,el]);
  h.rules.forEach(([x0,x1],j)=>{const ln=document.createElement('div'), inner=j===0?x1:x0;
    ln.style.cssText='position:absolute;left:'+x0+'px;top:'+(h.rule_y-P.rule_px/2)+'px;width:'+(x1-x0)+'px;height:'+P.rule_px+
      'px;transform-origin:'+(j===0?'100%':'0%')+' 50%';
    const dm=document.createElement('div'), cx=j===0?x1+g+d/2:x0-g-d/2;
    dm.style.cssText='position:absolute;left:'+(cx-d/2)+'px;top:'+(h.rule_y-d/2)+'px;width:'+d+'px;height:'+d+'px;transform:rotate(45deg)';
    [ln,dm].forEach((e,m)=>{ui.appendChild(e);e.setAttribute('data-line','rule:'+h.key+':'+j+':'+m);if(A)A.line(el,e);
      if(paper)BLEND.push([e,el]);fades(e,sp);});
    sp.forEach(s=>tl.fromTo(ln,{scaleX:0},{scaleX:1,duration:P.rule_draw_s,ease:'power2.out',immediateRender:false},s[0]));
    gsap.set(ln,{scaleX:sp.length?0:1});
  });
});
// hand notes: written on left to right, then the arrow draws to its target; fixed on-screen size under the camera
const arrows=[];
(LY.notes||[]).forEach(n=>{
  const el=document.createElement('div');el.className='pin';el.style.left=n.anchor[0]+'px';el.style.top=n.anchor[1]+'px';el.style.visibility='visible';
  el.innerHTML='<div class="pb"><div class="lw" style="position:absolute;left:0;top:0"><div class="beside" data-qa="note:'+n.key+'"></div></div></div>';
  const lab=el.querySelector('.beside'), lw=el.querySelector('.lw'), pb=el.querySelector('.pb');
  lab.textContent=n.text;lab.style.cssText+=';left:0;top:0;font-size:'+n.px+'px;text-shadow:none';font(lab,...R.note);
  if(A)A.el(lab,'note:'+n.key,LG.halo_width_em);
  gsap.set(lab,{xPercent:-50,yPercent:-50,rotation:n.angle});cam.appendChild(el);
  legs.forEach(g=>tl.fromTo(pb,{scale:1/g.from.s},{scale:1/g.L.to.s,duration:g.d,ease:g.inv,immediateRender:g.k===0},g.t0));
  const sp=LY.els['note:'+n.key]||[];fades(lw,sp);if(paper)BLEND.push([pb,lab]);
  gsap.set(lab,{clipPath:'inset(-20% 100% -20% 0%)'});
  sp.forEach(s=>tl.fromTo(lab,{clipPath:'inset(-20% 100% -20% 0%)'},{clipPath:'inset(-20% 0% -20% 0%)',duration:P.note_write_s,ease:'none',immediateRender:false},s[0]));
  if(n.arrow){const [x1,y1,x2,y2]=n.arrow, sv=document.createElementNS(NS,'svg');
    sv.setAttribute('width','1');sv.setAttribute('height','1');sv.style.cssText='position:absolute;left:0;top:0;overflow:visible';
    const mx=(x1+x2)/2, my=(y1+y2)/2, L=Math.hypot(x2-x1,y2-y1), cx=mx-(y2-y1)*0.15, cy=my+(x2-x1)*0.15;
    const ang=Math.atan2(y2-cy,x2-cx), hl=Math.min(22,0.3*L), w=0.45;
    const path=document.createElementNS(NS,'path'), head=document.createElementNS(NS,'path');
    path.setAttribute('d','M'+x1+' '+y1+' Q'+cx+' '+cy+' '+x2+' '+y2);
    head.setAttribute('d','M'+(x2-hl*Math.cos(ang-w))+' '+(y2-hl*Math.sin(ang-w))+' L'+x2+' '+y2+' L'+(x2-hl*Math.cos(ang+w))+' '+(y2-hl*Math.sin(ang+w)));
    [path,head].forEach(e=>{e.setAttribute('fill','none');e.setAttribute('stroke-width','3.5');e.setAttribute('stroke-linecap','round');
      e.setAttribute('stroke-linejoin','round');sv.appendChild(e);});
    lw.appendChild(sv);sv.setAttribute('data-line','arrow:note:'+n.key);arrows.push([sv,lab]);
    const pl=path.getTotalLength(), hlen=head.getTotalLength();
    path.setAttribute('stroke-dasharray',pl+' '+pl);head.setAttribute('stroke-dasharray',hlen+' '+hlen);
    gsap.set(path,{attr:{'stroke-dashoffset':pl}});gsap.set(head,{attr:{'stroke-dashoffset':hlen}});
    sp.forEach(s=>{const a=s[0]+0.6*P.note_write_s;
      tl.fromTo(path,{attr:{'stroke-dashoffset':pl}},{attr:{'stroke-dashoffset':0},duration:0.3,ease:'power1.inOut',immediateRender:false},a);
      tl.fromTo(head,{attr:{'stroke-dashoffset':hlen}},{attr:{'stroke-dashoffset':0},duration:0.12,ease:'none',immediateRender:false},a+0.3);});}
});
// per frame (after the ink driver): blend modes from the ink state, emboss ghosts copied from their source, note
// arrows in the note's ink
const sync=()=>{
  BLEND.forEach(([e,t])=>{let va=0;try{va=+(JSON.parse(t.getAttribute('data-ink-state')||'{}').va||0);}catch(_){}
    e.style.mixBlendMode=va>0?'normal':'multiply';});
  ghosts.forEach(G=>{G.src.forEach((s,j)=>{G.dst[j].style.cssText=s.style.cssText;});
    const [gp,gw,gl]=G.dst;gw.style.opacity=(+getComputedStyle(G.src[1]).opacity)*P.emboss_alpha;gw.style.top=P.emboss_dy+'px';
    gl.style.color=P.emboss_colour;gl.style.textShadow='none';gl.style.setProperty('--vig','none');gl.style.setProperty('--halo-c','transparent');
    gp.style.mixBlendMode='normal';});
  arrows.forEach(([sv,lab])=>{const c=getComputedStyle(lab).color;sv.querySelectorAll('path').forEach(e=>e.setAttribute('stroke',c));
    const m=c.match(/\d+/g);if(m)sv.setAttribute('data-line-ink',JSON.stringify(['#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join('')]));});
};
const D=S.n_frames/FPS, drv={t:0};
tl.fromTo(drv,{t:0},{t:D,duration:D,ease:'none',immediateRender:true,onUpdate:sync},0);
if(A)A.up();sync();document.fonts.ready.then(()=>{if(A)A.up();sync();});
})();
</script>
