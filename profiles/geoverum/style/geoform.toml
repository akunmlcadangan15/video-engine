# Geoform and cross-section: terrain variants, underground, river width
[geoform]
terrain_variants = ["satellite_terrain", "geoid_globe", "cross_section", "underground_mine", "river_width"]
cross_section = { layers = true, labels = true }
underground = { fire = "orange_glow", depth_label = true }
river_width = { measure = "white_double_arrow" }
