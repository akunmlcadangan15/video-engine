# Printed Cartographic Typography & Surface Grading Specification (Gates T01 & B01).
# Controls surface classification between dark satellite imagery and bright archival paper maps,
# paper texture compositing, multiply ink blending, and serif/handwritten typographic roles.
# Included automatically by profiles/geoverum.toml; orientation positions live under [print.portrait] / [print.landscape].

[print]                       # Printed surface grading and archival typography controller (video_engine/printstyle.py; docs/SPEC.md, Section F2)
paper_min_y = 0.52            # Median basemap APCA luminance threshold (Y >= 0.52) required to classify a map as a bright archival/parchment surface. Keeps dark satellite basemaps (typically Y 0.05-0.25, or up to Y ~ 0.48 on snowy/glacial frames) in satellite rendering mode with glowing neon borders rather than vintage paper multiply mode
max_typefaces = 2             # Maximum distinct typeface families permitted simultaneously on screen (gate T01, excluding burned-in captions and channel watermark)
watermark_clear_px = 32       # Minimum clearance in pixels required between map typography and the channel watermark (gate B01)
ink = "#2A231D"               # Primary dark espresso ink color applied to text and rules on bright archival paper surfaces
vignette_alpha = 0.12         # Edge vignette darkening opacity applied to archival paper maps
grade_saturate = 1.10         # Color saturation multiplier applied when grading archival paper maps
grade_contrast = 0.96         # Contrast multiplier applied when grading archival paper maps
paper_texture = "paper-F1E8D4.jpg" # Fine parchment fiber texture composited over surfaces classified as paper (Y >= paper_min_y)
paper_alpha = 0.22            # Opacity of the parchment fiber texture overlay on paper surfaces
grain = "grain-512.png"       # Fine film/paper luminance grain texture overlay
grain_alpha = 0.40            # Opacity of the luminance grain overlay on paper surfaces
region_multiply = true        # Multiplies polygon fills into the paper fiber texture when rendering on bright archival paper surfaces (ignored on dark satellite surfaces)
region_edge_l = 0.35          # OKLCH lightness of polygon border strokes on bright archival paper surfaces
region_edge_l_dark = 0.78     # OKLCH lightness fallback for polygon border strokes when print mode is explicitly forced on a dark background
region_edge_alpha = 0.90      # Opacity of printed polygon border strokes
title_px = 88                 # Display title font size in pixels on archival paper surfaces (matches [type] title_px_paper)
title_px_min = 64             # Minimum display title font size in pixels after long-string auto-scaling
title_width_max = 0.55        # Maximum fraction of canvas width occupied by a printed display title before wrapping or scaling
title_rot_max = 8             # Maximum allowed rotation angle in degrees for curved or slanted cartographic titles
title_tracking = 0.12         # Letter-spacing (tracking) in em units for resting cartographic titles
title_tracking_in = 0.30      # Initial expanded letter-spacing in em units at the start of a title entrance animation
title_weight = 600            # Font weight (semi-bold) for printed cartographic display titles
title_in_s = 0.35             # Entrance animation duration in seconds for printed cartographic titles
dark_tracking = 0.04          # Tighter letter-spacing in em units applied to sans-serif titles on dark satellite surfaces
emboss_colour = "#FAF5E8"     # Warm highlight color for subtle letterpress embossing on paper titles
emboss_alpha = 0.40           # Opacity of the letterpress highlight emboss
emboss_dy = 2                 # Vertical offset in pixels for the letterpress highlight emboss
year_width = 0.38             # Target fraction of canvas width spanned by a 4-digit historical year anchor
year_px_min = 220             # Minimum font size in pixels for hero historical year anchors
year_px_max = 250             # Maximum font size in pixels for hero historical year anchors
year_weight = 450             # Font weight for historical year digits on bright archival paper surfaces
year_dark_weight = 700        # Bold font weight (700) for historical year digits on dark satellite surfaces
year_dark_colour = "#FFFFFF"  # White historical year digits on dark satellite surfaces (all light text on imagery is neutral white)
time_px = 36                  # Font size in pixels for secondary chronological sub-labels beneath a year anchor
time_tracking = 0.14          # Letter-spacing in em units for chronological sub-labels
time_alpha = 0.75             # Opacity of chronological sub-labels
time_gap = 24                 # Vertical gap in pixels between a hero year anchor and its chronological sub-label
heading_px = 42               # Font size in pixels for upper cartographic section headings
heading_tracking = 0.14       # Letter-spacing in em units for upper cartographic section headings
heading_weight = 600          # Font weight for upper cartographic section headings
heading_ink = "#5B3A23"       # Warm bronze-sepia ink color for section headings on paper surfaces
heading_light = "#F3EAD8"     # Warm cream color for section headings on dark satellite surfaces
heading_shadow_alpha = 0.40   # Drop-shadow opacity behind section headings on dark satellite surfaces
rule_px = 1.5                 # Stroke thickness in pixels for ornamental horizontal divider rules flanking a heading
rule_len = 120                # Length in pixels of ornamental horizontal divider rules
rule_gap = 16                 # Horizontal gap in pixels between heading text and flanking divider rules
diamond_px = 7                # Size in pixels of the center diamond ornament on cartographic divider rules
heading_fade_s = 0.3          # Fade-in duration in seconds for section headings
rule_draw_s = 0.4             # Progressive stroke-draw duration in seconds for ornamental divider rules
label_px = 54                 # Font size in pixels for printed place labels on paper surfaces
label_weight = 600            # Font weight for printed place labels
label_dark_px = 48            # Font size in pixels for place labels on dark satellite surfaces
leader_len = 48               # Default pointer leader-line length in pixels connecting a displaced label to its pin
leader_gap = 12               # Clearance gap in pixels between the end of a leader line and the label bounding box
note_px = 56                  # Font size in pixels for handwritten callout notes (Caveat typeface)
note_ink = "#2E4E7A"          # Archival fountain-pen blue ink color for handwritten notes on bright paper surfaces
note_light = "#FFFFFF"        # Crisp white ink color for handwritten notes on dark satellite surfaces (when not overridden by signal yellow #FFD417)
note_write_s = 0.5            # Progressive stroke write-on duration in seconds for handwritten notes and curved arrows

[print.portrait]              # Positions in px at 1080 x 1920 reference canvas (PRINT_RANGES["portrait"])
year_cx = 540
year_cy = 560
heading_baseline_y = 384

[print.landscape]             # Positions in px at 1920 x 1080 reference canvas (PRINT_RANGES["landscape"])
year_cx = 960
year_cy = 380
heading_baseline_y = 150
