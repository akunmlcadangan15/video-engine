# Printed typography and map grade (gates T01 and B01). Loaded by geoverum.toml `include`.

[print]                       # printed typography and map grade (video_engine/printstyle.py; keys: docs/SPEC.md, section F2)
paper_min_y = 0.30            # map p50 APCA Y >= this: paper surface (dark ink, multiply); else dark imagery (light text)
max_typefaces = 2             # T01, caption and watermark excluded
watermark_clear_px = 32       # B01
ink = "#2A231D"
vignette_alpha = 0.15
grade_saturate = 1.15
grade_contrast = 0.95
paper_texture = "paper-F1E8D4.jpg"
paper_alpha = 0.35
grain = "grain-512.png"
grain_alpha = 1.0
region_multiply = true
region_edge_l = 0.35
region_edge_l_dark = 0.75
region_edge_alpha = 0.85
title_px = 88
title_px_min = 64
title_width_max = 0.55
title_rot_max = 8
title_tracking = 0.12
title_tracking_in = 0.30
title_weight = 600
title_in_s = 0.35
dark_tracking = 0.04
emboss_colour = "#FAF5E8"
emboss_alpha = 0.40
emboss_dy = 2
year_cx = 540
year_cy = 560
year_width = 0.38
year_px_min = 220
year_px_max = 250
year_weight = 450
year_dark_weight = 700
year_dark_colour = "#F7F2E6"
time_px = 36
time_tracking = 0.14
time_alpha = 0.75
time_gap = 24
heading_px = 42
heading_tracking = 0.14
heading_weight = 600
heading_baseline_y = 384
heading_ink = "#5B3A23"
heading_light = "#F3EAD8"
heading_shadow_alpha = 0.40
rule_px = 1.5
rule_len = 120
