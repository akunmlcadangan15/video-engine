# Adaptive Map Text & Line Legibility Specification (Gate R64).
# Defines APCA luminance contrast targets, ink polarity selection, glyph halo escalation, knock-back vignettes,
# and vector stroke contrast rules across both dark satellite imagery and bright archival paper surfaces.
# Included automatically by profiles/geoverum.toml.

[legibility]                  # Adaptive map typography and vector contrast controller (docs/SPEC.md, Section F)
samples = 12                  # Number of temporal frames sampled across each text or vector element's visible lifespan
measure_scale = 0.25          # Downsampling factor (1/4 resolution) used when measuring background luminance under labels, years, and counters; titles are measured at full resolution
dark_percentile = 10          # Background luminance percentile evaluated when testing dark ink legibility
light_percentile = 90         # Background luminance percentile evaluated when testing light text legibility
adjacent_px = 2               # Ring dilation width in pixels immediately surrounding glyphs for local edge-contrast measurement
adjacent_percentile = 1       # Worst-case background percentile sampled within the adjacent pixel ring
light_p50_max = 0.38          # Median background APCA luminance (Y) ceiling below which the surface is classified as dark satellite imagery, preserving crisp white text and luminous region borders
lc_title = 60                 # Minimum required APCA contrast (Lc) for primary display titles
lc_title_aim = 75             # Target APCA contrast (Lc) sought by the escalation ladder for primary display titles
lc_figure = 60                # Minimum required APCA contrast (Lc) for hero numbers, counters, and year callouts
lc_label = 75                 # Minimum required APCA contrast (Lc) for compact pin and city labels
lc_area = 60                  # Minimum required APCA contrast (Lc) for regional and hydrographic area labels
lc_floor = 15                 # Absolute APCA contrast floor below which text is considered illegible at any frame
lc_fail_margin = 5            # Tolerance margin in Lc units before triggering an R64 contrast failure
wcag_label = 4.5              # Supplementary WCAG 2.x contrast ratio target for standard map labels
wcag_title = 3.0              # Supplementary WCAG 2.x contrast ratio target for large display titles
ink_l = 0.26                  # Base OKLCH lightness (0.26) for warm sepia ink rendered on bright paper/parchment surfaces
ink_c = 0.03                  # Base OKLCH chroma (0.03) for warm sepia ink on paper surfaces
ink_hue = 60                  # Base OKLCH hue angle (60 deg, warm sepia) for dark ink on paper surfaces
ink_l_min = 0.18              # Minimum OKLCH lightness floor reached when darkening ink down the escalation ladder
ink_l_step = 0.04             # Lightness decrement per step when escalating dark ink contrast
entity_text_l_min = 0.32      # Minimum OKLCH lightness for entity-colored place labels on paper surfaces
entity_text_l_max = 0.36      # Maximum OKLCH lightness for entity-colored place labels on paper surfaces
entity_text_c_scale = 0.8     # Chroma scaling factor applied when deriving text ink from an entity's polygon fill color
text_fallback = "#5F4025"     # Deep umber fallback ink color when an entity's palette color cannot achieve sufficient contrast as text
never_text = ["#C99D4E"]      # Palette colors (such as high-luminance ochre) excluded from direct use as dark text ink on light paper
light_l = 0.98                # OKLCH lightness for light text over dark satellite imagery (pure white, as the reference titles and labels)
light_c = 0.0                 # OKLCH chroma 0: neutral white light text (no warm cream cast)
light_hue = 85                # OKLCH hue of light text (no effect while light_c = 0)
water_ink_l = 0.34            # OKLCH lightness for italic hydrographic (ocean, sea, river) labels on paper maps (#033D57)
water_ink_c = 0.07            # OKLCH chroma for hydrographic labels on paper maps
water_ink_hue = 235           # OKLCH hue angle (235 deg, deep marine blue) for hydrographic labels
halo_width_em = 0.07          # Default glyph halo stroke width expressed in em units
label_halo_width_em = 0.06    # Glyph halo stroke width in em units for compact pin labels
halo_l_min = 0.90             # Minimum OKLCH lightness for light paper halos behind dark ink
halo_l_max = 0.97             # Maximum OKLCH lightness for light paper halos behind dark ink
halo_c_scale = 0.5            # Chroma scaling factor for tinted halos
halo_alpha = 0                # Disables bright glyph halos around dark printed ink by default so archival maps retain an authentic typeset appearance
halo_alpha_max = 0            # Keeps bright glyph halos disabled across all escalation steps on paper surfaces (uses vignette knock-back instead)
halo_width_min_em = 0.06      # Minimum permitted halo width in em units
halo_width_max_em = 0.10      # Maximum permitted halo width in em units
halo_blur_ratio = 0.25        # Gaussian blur standard deviation as a fraction of halo width
halo_blur_max_ratio = 0.5     # Maximum Gaussian blur ratio for outer glyph halos
counter_min_px = 6            # Minimum interior pixel area required inside enclosed glyph counters (e.g., 'a', 'e', 'o', 'B', '0') after 1 px morphological erosion
counter_diff_max = 16         # Maximum allowed luminance difference inside enclosed glyph counters to prevent halo fill-in
counter_open_min = 0.9        # Minimum fraction of enclosed glyph counters that must remain open and unoccluded
glow_px = 4                   # Subtle outer glow radius in pixels for light text on dark satellite imagery
glow_alpha = 0.25             # Opacity of the entity-colored outer glow behind light text on satellite imagery
glow_colour = "entity"        # Binds the text outer glow color to the associated territory's entity color
ladder_order = "ink_first"    # Contrast escalation sequence on paper: darkens ink toward ink_l_min first, then applies a localized paper-colored knock-back vignette
polarity_fallback = false     # Locks text polarity to surface type (dark ink on paper surfaces, light text on dark satellite imagery) without flipping mid-scene
lc_heading = 60               # Minimum required APCA contrast (Lc) for section headings
lc_note = 75                  # Minimum required APCA contrast (Lc) for handwritten margin notes and callouts
shadow_dy_px = 2              # Vertical drop-shadow offset in pixels for adaptive labels
shadow_blur_px = 4            # Gaussian blur radius in pixels for adaptive label drop shadows
shadow_alpha = 0.35           # Base drop-shadow opacity for adaptive labels
shadow_colour = "#2a1c12"     # Deep espresso shadow tint
light_halo_alpha_min = 0.60   # Initial dark halo opacity rung when light text crosses bright satellite features (clouds, snow, desert, or bright polygon fills)
light_halo_alpha_max = 0.85   # Maximum dark halo opacity rung for light text over bright satellite features
light_halo_steps = 3          # Number of discrete escalation rungs for dark halos behind light satellite labels
light_halo_ink = "#ffffff"    # Forces pure white (#ffffff) glyph fill on the highest escalation rung so contrast over bright regions exceeds Lc 70
vignette_scale = 1.4          # Bounding-box multiplier for localized knock-back vignettes behind low-contrast text
vignette_feather = 0.6        # Feathering falloff ratio for localized knock-back vignettes
vignette_alpha_min = 0.10     # Minimum opacity rung for localized knock-back vignettes
vignette_alpha_max = 0.22     # Maximum opacity rung for localized knock-back vignettes
vignette_steps = 3            # Number of escalation steps for knock-back vignette opacity
hold_frames = 8               # Minimum number of frames a legibility state is held to prevent rapid frame-to-frame flicker
crossfade_ms = 150            # Crossfade duration in milliseconds when transitioning between legibility escalation rungs
ema_tau_ms = 250              # Exponential moving average time constant in milliseconds for smoothing sampled background luminance
basemap_chroma = 0.88         # Chroma retention multiplier for dark satellite basemaps (keeps ocean and vegetation colors rich while avoiding oversaturation)
entity_fill_alpha = 0.35      # Baseline polygon fill opacity on bright archival paper surfaces (on dark satellite surfaces, the renderer uses max(theme.region_fill_opacity, entity_fill_alpha))
entity_outline_px = 2.5       # Baseline polygon border width in pixels on archival paper surfaces
pin_outline_px = 2.5          # Contrasting outline thickness in pixels around teardrop map pins
paper_colour = "#f1e8d4"      # Canonical warm parchment reference color used for knock-back vignettes and pin outlines on paper scenes
route_casing_px = 1.75        # Dark outer casing stroke width in pixels around animated route lines for separation over bright terrain
route_casing_colour = "#2a1c12" # Dark espresso color for route outer casings
region_casing_px = 0          # Disables secondary dark outer casings around region borders so glowing satellite borders remain clean
leader_casing_px = 0          # Disables secondary outer casings on label leader lines
lc_line = 30                  # Minimum target APCA contrast (Lc) for vector lines (routes, region borders, pin outlines, leader lines)
lc_line_fail = 25             # APCA contrast floor below which a vector line triggers a legibility warning
line_ring_px = 3              # Sampling ring width in pixels on either side of a vector stroke
line_percentile = 10          # Background percentile evaluated along a vector stroke's sampling ring
line_mask_diff = 24           # Minimum pixel value delta used when masking adjacent vector strokes
