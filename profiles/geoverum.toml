# Geoverum Brand Style Profile (supports both 9:16 portrait and 16:9 landscape).
# Holds brand identity, typography, colours, caption styling, watermark, sound/surface styling, and technical
# quality/legibility checks; creative direction, story structure and video duration are unconstrained.
description = "Geoverum: cartographic brand style (9:16 & 16:9)"
include = ["geoverum/core.toml", "geoverum/entities.toml", "geoverum/legibility.toml", "geoverum/print.toml", "geoverum/sound.toml", "geoverum/layout.toml"]

# Caption geometry per orientation (shared caption look lives in geoverum/core.toml).
[caption_style.portrait]
size = 48                     # Font size in pixels at 1080 x 1920 reference resolution
ab_sizes = [48]               # Allowed caption font size candidates for timeline validation
max_words = 4                 # Maximum words displayed simultaneously per caption cue
fixed_y = 1366                # Vertical center of the caption line in pixels (~71.1% of 1920 px height)
max_bottom_y = 1480           # Lower safe-area boundary in pixels (gate Z01) above platform UI overlays
place_band = [0.58, 0.76]     # Permitted vertical normalized band for collision avoidance
clearance = 0                 # Minimum required pixel gap between caption box and map overlays (gate R63)

[caption_style.landscape]
size = 58                     # Font size in pixels at 1920 x 1080 reference resolution
ab_sizes = [58]               # Allowed caption font size candidates for timeline validation
margin_x = 160                # Horizontal margin in pixels at 1920 x 1080 reference resolution
max_words = 4                 # Maximum words displayed simultaneously per caption cue
fixed_y = 900                 # Vertical center of the caption line in pixels (lower third at 1080 height)
place_band = [0.74, 0.88]     # Permitted vertical normalized band for collision avoidance
clearance = 90                # Minimum required pixel gap between caption box and map overlays (gate R63)

[watermark.portrait]          # Shared mark attributes live in geoverum/core.toml; top right by default
px = 40                       # Font size in pixels at 1080 x 1920 reference resolution

[watermark.landscape]
px = 28                       # Font size in pixels at 1920 x 1080 reference resolution
corner = "bottom_right"       # Safe-area corner placement for 16:9 landscape layout
