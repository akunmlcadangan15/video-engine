# Geoverum channel profile. Spec: Style Lab brand profile (brand/geoverum/brand-profile.md).
description = "Geoverum: map-led geography shorts"
# Large tables and the entity colours live in profiles/geoverum/ (merged under this file; keys here win).
include = ["geoverum/entities.toml", "geoverum/legibility.toml", "geoverum/print.toml", "geoverum/sound.toml", "geoverum/layout.toml", "geoverum/style/dataviz.toml", "geoverum/style/radar.toml", "geoverum/style/historical.toml", "geoverum/style/icons.toml", "geoverum/style/routes.toml", "geoverum/style/semantic.toml", "geoverum/style/climate.toml", "geoverum/style/geoform.toml", "geoverum/style/timeline.toml", "geoverum/style/motion.toml"]

# EXPERIMENTAL: flag settings inherit the engine defaults unless overridden.
[flags]
alpha = 0.85
reveal_s = 0.45
edge_px = 3
glow_px = 6
fit = "auto"           # per region: cover, contain where cropping would cut > auto_max_loss
pin_height_pct = 4.5

[type]              # canonical type scale: matches [theme] title_px/pin_label_px and [print] title_px
title_px = 112
title_px_paper = 88
pin_label_px = 52

[caption_style]
# Approved 2026-11-01 (style-lab upgrade-v2 A/B): bold Inter 84 px, white, no outline, no box, at about 0.72 H.
font = "Inter"                # family Inter; bold=true makes libass pick vendor/fonts/Inter-Bold.otf
bold = true
size = 84                     # approved in the 2026-11-01 A/B (84 / 92 / 104); 92 and 104 were rejected as too heavy
ab_sizes = [84]               # approved size; a timeline caption_style.size can still override it technically
outline = 0                   # no outline; the soft shadow carries readability
soft_shadow = true            # drop shadow 0 3 px, blur, black at .55 (layer 0, no backing box)
shadow_dx = 0
shadow_dy = 3
shadow_blur = 4               # libass \blur (gaussian); about a CSS 8 px blur
shadow_alpha = 115            # ASS alpha 0x73 = 55 % opaque
active_word_highlight = false
emphasis_scale = 1.0
max_words = 2
fixed_y = 1382                # caption centre, px at 1920 height (about 0.72 x 1920)
max_bottom_y = 1480           # Z01: caption box bottom at or above the Shorts lower UI limit
forbid_box = false            # advisory since 2026-11-04: captions may use a box (style choice, not blocked)
auto_place = true             # a caption that would hit a pin, label or figure shifts (R63 fix) ...
place_band = [0.60, 0.76]     # ... inside the approved lower band, centre 0.60-0.76 H (1152-1459 px)
clearance = 0                 # captions must still not intersect any element box (R63)

[audio]
target_lufs = -14.0
true_peak = -1.5
lra = 11.0
tolerance_lu = 0.2
require_source = "epidemic"   # A02: music and SFX from Epidemic Sound only (docs/SOUND.md)

[draft]
min_seg_s = 3.0               # flexible segment pacing; short cuts and montages allowed
max_seg_s = 30.0
map_path = true               # map segments may carry a multi-key camera path
scene = ["globe", "props", "beats", "radar", "terrain3d", "cross_section", "historical", "flag_char", "data_viz"]   # draft map scene opt-ins (draft_scene.py); no "morph": [transitions] map_morph is off
rules_file = "geoverum/creative.md"   # single source: profiles/geoverum/creative.md (do not duplicate rules here)

[motion]                     # EXPERIMENTAL (A/B): a slightly snappier small-overlay token
overlay_frames = 5           # 5 frames at 30 fps (~167 ms); documented A/B range 4-6, default engine 7
overlay_frames_range = [4, 6]

[theme]
route_colour = "#FFD417" # kuning putus-putus (referensi: Pan-American, rute)
camera_drift_per_s = 0.06     # scale growth / s of the drift between camera pulses: 0.06 ln/s at the start of a wait,
                              # above [gates.camera] still_zoom_ln_s (moving), below it after 3.3 s
camera_start_speed = 0.75      # globe and camera_path: first-key speed as a share of the first leg's mean
camera_end_speed = 1.0         # globe and camera_path: last-key speed as a share of the last leg's mean when the shot ends there
region_edge = "glow"          # same-colour edge; [legibility] sets fill alpha and a 3-4 px outline, no blur
region_style = "tint"         # flat translucent fill + glow, bukan block 3D (hasil rea-video 10 video)
label_style = "plain"         # EXPERIMENTAL: plain adaptive labels; opt into a dark box per pin / region / figure
year_box_colour = "#f6efe0"   # years on a bright cream box with paper grain, dark serif digits, about label size
year_box_ink = "#2a231d"
year_box_px = 88
year_box_texture = "grain-paper002.jpg"
pin_style = "teardrop"        # red teardrop with a white dot, paper outline and shadow, bounce drop-in, label beside
pin_colour = "#c4302a"
label_font = "inter"          # map labels; [print] sets the printed roles per surface
title_font = "inter"          # titles and numbers; [print] sets the printed roles per surface
title_px = 112
# region colours, muted OKLCH (L 0.40-0.82, C <= 0.12); entities missing from [theme.entities] take the free ones in
# this order; teal and indigo never adjacent
palette = ["#00E676", "#FF9100", "#FF1744", "#2979FF", "#FFEA00", "#00B0FF", "#76FF03", "#FF4081", "#FF6D00", "#18FFFF"] # saturasi tinggi glow (referensi), bukan muted OKLCH

[camera]                      # kamera: continuous push-in/pull-back, bukan pulse (hasil rea)
                              # frames break a layout rule (0.75, 0.5, 0.25, 0 of this size)
max_zoom = 16                 # deepest camera zoom: country-scale close-ups from a whole-map source
# flow camera paths (camera key move "flow") lean into their motion like a drone: fitted to the Amazon reference
# (UW3mWOVzWvU, 2026-11-02): perspective grows with screen speed, the map banks with sideways travel
bank_roll = 12                # deg of roll per frame width / s sideways
bank_tilt = 9                 # deg of extra tilt per frame width / s of screen speed
bank_max_roll = 20
bank_max_tilt = 16
bank_smooth_s = 0.5

[transitions]                 # EXPERIMENTAL (A/B): hard cut on a visual-type change, short state change on one map
kind = "cut"                  # every boundary is a hard cut unless a rule or a segment transition_in says otherwise
same_type = { map = "state" } # map -> map on the same map_asset: 0.2 s state dissolve, never a long crossfade
state_s = 0.2                 # EXPERIMENTAL: state dissolve length (0.1-0.4 s)
fade_s = 0.4                  # crossfade only when requested explicitly (timeline transition_in = "crossfade")
page_turn = false             # Arundaya rejects page-turn / paper transitions (Siam revision 2)
map_morph = true              # boleh morph satelit -> skematik/kertas historis (002,006,011)

[render]                      # best practical quality, under ~300 MB for a 90 s Short
hf_quality = "high"           # HyperFrames: JPEG q100 screenshots + x264 slow
hf_crf = 8
segment_crf = 8               # intermediates: near-lossless, no fastdecode tune (keeps CABAC and deblocking)
segment_preset = "medium"
segment_tune = "none"
final_crf = 12                # upload file: x264 veryslow, CRF 12, 10-bit High 10, capped at 40 Mb/s
final_preset = "veryslow"
final_tune = "none"
final_maxrate_kbps = 40000
final_bit_depth = 10          # no encoder banding in sky, sea and glow gradients; YouTube accepts 10-bit uploads
map_jpeg_quality = 95         # map derivatives and deep tiles

[gates]                       # style gates whose fails block a build; every other style gate only warns
require = []                  # 2026-11-04: no style gate blocks; all style gates only warn
advisory = ["R64", "E01", "R56", "T01", "R44", "AS04", "F01", "F02", "F03", "F04", "L01", "L02", "L03", "L04", "L05", "L06", "L07", "L08", "L09", "L10", "R62", "R63", "Z01", "O01", "M02", "M04", "G02", "B01"]

[gates.hook]
vo_warn_s = 0.2
vo_fail_s = 0.8
caption_warn_s = 0.2
caption_fail_s = 1.0
graphic_warn_s = 1.5
graphic_fail_s = 3.0
open_on_moving_map = true

[gates.camera]                # P01: planned camera motion
hold_warn_s = 1.7
hold_fail_s = 3.0
moving_warn = 0.8
still_zoom_ln_s = 0.05        # zoom speed below this is still; the 0.06 ln/s drift is moving
still_pan_w_s = 0.02
min_drift_per_s = 0.06        # P02: the drift between camera moves stays >= 0.06 ln/s (theme camera_drift_per_s)

[gates.novelty]
max_gap_s = 3.0

[gates.silence]
max_gap_s = 0.65
threshold_db = -40.0

[gates.keyword_return]
hook_s = 3.0
end_s = 5.0
min_chars = 4

[gates.ending_keyword]         # K02: the keyword is still readable on the final frame
hook_s = 3.0
end_s = 5.0
min_chars = 4

[gates.cta]                    # C02: no call to action and no end card
phrases = ["terima kasih", "subscribe", "follow", "like", "share", "tonton", "kunjungi", "link di bio",
           "sampai jumpa", "jangan lupa", "selesai"]

[gates.geo]                    # G02: pins on land, labels inside their own region
require_land = true

[gates.duration]
min_s = 45.0
max_s = 100.0

[watermark]
text = "Geoverum"             # channel mark, top right inside the safe area (burned in by the final mux)
font = "inter"
px = 40
colour = "#ffffff"
opacity = 0.85
shadow = true
