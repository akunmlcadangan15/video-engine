Azerbaijan = "#A19073"        # taupe
"Black Sea" = "#549CC0"       # sky
Mediterranean = "#70B8C6"     # lagoon
Paratethys = "#AEC8DC"        # mist
Atlantic = "#4B4D8B"          # indigo
