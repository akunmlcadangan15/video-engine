[watermark]
text = "Geoverum"             # channel mark, top right inside the safe area (burned in by the final mux)
font = "inter"
px = 40
colour = "#ffffff"
opacity = 0.85
shadow = true

[sound]                       # SFX cues from render events + music ducked under the voiceover
duck_db = -12.0               # music under speech (word timestamps of the voiceover)
duck_attack_s = 0.15
duck_release_s = 0.4
duck_merge_s = 0.5            # word gaps up to 0.5 s stay ducked
fade_in_s = 0.3
fade_out_s = 1.0

[sound.events]                # render event -> SFX kind (clicks and beeps allowed for this channel)
pin = "pop"
figure = "pop"
label = "tick"
region = "tick"
route = "whoosh"
whip = "whoosh"
counter_tick = "counter_tick"
title = "impact"

[sound.kinds.pop]
gain_db = -14.0
max_s = 0.6

[sound.kinds.tick]
gain_db = -16.0
max_s = 0.4

[sound.kinds.whoosh]
gain_db = -12.0
align = "peak"                # whoosh peak on the middle of the move
max_s = 1.5

[sound.kinds.counter_tick]
gain_db = -20.0
max_s = 0.08

[sound.kinds.impact]
gain_db = -10.0
max_s = 2.0

# beats layout of map scenes (video_engine/layout.py, gates L01-L10); positions, sizes, zones and timing only.
# Lengths are px at 1080 x 1920.
[layout.grid]
x0 = 64                       # 6 columns of 104 px with 40 px gutters: left edges 64, 208, 352, 496, 640, 784
columns = 6
col_w = 104
gutter = 40
unit = 8

[layout.zones]
safe = [48, 288, 888, 1248]   # text safe area x0, y0, x1, y1
z1 = [64, 304, 888, 440]      # top slot: title or data card, left-aligned
z2 = [64, 488, 888, 1100]     # map focus: active region, pins, map labels, routes
z2_pad = 48
group_gap = 48            # between groups (area label to pins, routes, other text)

[layout.sizes]
title = 112
year = 128
time = 56
pin_label = 52
pin_label_min = 44
area_label = 44
area_tracking = 0.08
hero_ratio = 1.5

[layout.budget]
texts = 4
labelled_pins = 2
routes = 1
animating = 2

[layout.timing]
enter_s = 0.35                 # fly-through scale time ([layout.fly])
exit_s = 0.3                   # fly-through exit time
exit_max_s = 0.3
stagger_s = 0.2
settle_s = 0.8
min_hold_s = 1.0
chars_per_s = 20

[layout.labels]
offset = 16
edge_clear = 24
text_clear = 16
route_clear = 24
area_inset = 24
leader_max = 120
route_pin_gap = 24
card_gap = 32
dim_alpha = 0.10
caption_ground = 0.10

[layout.fly]                   # texts scale in through the frame and out past it
title_in = 2.6
figure_in = 2.2
label_in = 3.0
out = 2.6
title_opacity_in_s = 0.15
figure_opacity_in_s = 0.40
ease_in = "expo.out"
ease_out = "power2.in"         # cubic ease-in
