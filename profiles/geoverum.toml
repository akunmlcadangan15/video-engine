[camera]                      # every camera wait: pulses away and back, drift between them
pulse_zoom = 0.3              # ln zoom per pulse, peak speed 1.06 ln/s; the layout planner shrinks a pulse whose
                              # frames break a layout rule (0.75, 0.5, 0.25, 0 of this size)
pulse_s = 0.8                 # pulse length
pulse_gap_s = 0.3             # minimum drift before, between and after pulses
pulse_pan = 0.04              # frame-centre shift per pulse, frame widths (sides alternate)
pulse_ease = [0.3, 0.0, 0.15, 1.0]
pulse_anchor = [0.44, 0.41]   # screen point that stays put: centre of [layout.zones] z2
pulse_direction = "in"        # push in, then back
max_zoom = 16                 # deepest camera zoom: country-scale close-ups from a whole-map source

[transitions]                 # every segment boundary: a short dissolve; never a page turn or a paper morph
kind = "crossfade"            # 0.4 s crossfade centred on the boundary (map <-> photo, map <-> map alike)
fade_s = 0.4
page_turn = false             # Arundaya rejects page-turn / paper transitions (Siam revision 2)
map_morph = false             # map segments stay on their satellite base (no satellite -> paper morph)

[render]                      # best practical quality, under ~300 MB for a 90 s Short
hf_quality = "high"           # HyperFrames: JPEG q100 screenshots + x264 slow
hf_crf = 8
segment_crf = 8               # intermediates: near-lossless, no fastdecode tune (keeps CABAC and deblocking)
segment_preset = "medium"
segment_tune = "none"
final_crf = 12                # upload file: x264 slower, CRF 12, capped at 25 Mb/s
final_preset = "slower"
final_tune = "none"
final_maxrate_kbps = 25000
map_jpeg_quality = 95         # map derivatives and deep tiles

[gates]                       # style gates whose fails block a build; every other style gate only warns
require = ["P01", "P02", "H01", "C01", "C02", "V01", "D01", "K01", "K02", "S01", "AS01"]   # Geoverum's editorial rules and AS01 block a build; every other style gate only warns

[gates.anti_slop.levels]
AS01 = "fail"                 # decorative side-strip panels fail; every other anti-slop rule keeps its default warn

[gates.hook]
vo_warn_s = 0.2
vo_fail_s = 0.8
caption_warn_s = 0.2
caption_fail_s = 1.0
graphic_warn_s = 1.5
graphic_fail_s = 3.0
open_on_moving_map = true

[gates.cuts]
warn_per_10s = 0.41
fail_per_10s = 1.65
first_warn_s = 21.0
first_fail_s = 6.5

[gates.camera]                # P01: planned camera motion
hold_warn_s = 1.7
hold_fail_s = 3.0
moving_warn = 0.8
still_zoom_ln_s = 0.05        # zoom speed below this is still; the 0.06 ln/s drift is moving
still_pan_w_s = 0.02
min_drift_per_s = 0.06        # P02: the drift between camera moves stays >= 0.06 ln/s (theme camera_drift_per_s)

[gates.visual_type]

[gates.novelty]
max_gap_s = 3.0

[gates.silence]
max_gap_s = 0.65
threshold_db = -40.0

[gates.keyword_return]
hook_s = 3.0
end_s = 5.0
min_chars = 4

[gates.ending_keyword]         # K02: the keyword is still readable on the final frame
hook_s = 3.0
end_s = 5.0
min_chars = 4

[gates.cta]                    # C02: no call to action and no end card
phrases = ["terima kasih", "subscribe", "follow", "like", "share", "tonton", "kunjungi", "link di bio",
           "sampai jumpa", "jangan lupa", "selesai"]

[gates.geo]                    # G02: pins on land, labels inside their own region
require_land = true

[gates.duration]
min_s = 45.0
max_s = 90.0

[legibility]                  # adaptive map text; R64 on (keys: docs/SPEC.md, section F)
samples = 12                  # background samples per element life
measure_scale = 0.25          # labels, years, counters measured at 1/4 resolution; titles at full
dark_percentile = 10          # hard case for dark ink
light_percentile = 90         # hard case for light text
adjacent_px = 2
adjacent_percentile = 1
light_p50_max = 0.18          # light text only on backgrounds with p50 Y below this
lc_title = 60
lc_title_aim = 75
lc_figure = 60                # years and counters
lc_label = 75                 # pin labels
lc_area = 60                  # area labels (region and water names)
lc_floor = 15
lc_fail_margin = 5
wcag_label = 4.5
wcag_title = 3.0
ink_l = 0.26                  # oklch(0.26 0.03 60): warm sepia ink
ink_c = 0.03
ink_hue = 60
ink_l_min = 0.18
ink_l_step = 0.04
entity_text_l_min = 0.32       # entity-coloured text (place names): OKLCH L 0.32-0.36, chroma x 0.8
entity_text_l_max = 0.36
entity_text_c_scale = 0.8
text_fallback = "#5F4025"     # umber
never_text = ["#C99D4E"]      # ochre
light_l = 0.95
light_c = 0.02
light_hue = 85
water_ink_l = 0.34            # oklch(0.34 0.07 235) = #033D57: water labels, blue italic
water_ink_c = 0.07
water_ink_hue = 235
halo_width_em = 0.07
label_halo_width_em = 0.06
halo_l_min = 0.90
halo_l_max = 0.97
halo_c_scale = 0.5
halo_alpha = 0                 # printed ink: no glyph halo
halo_alpha_max = 0             # printed ink: no glyph halo at any step
halo_width_min_em = 0.06
halo_width_max_em = 0.10
halo_blur_ratio = 0.25        # blur sd = 0.25 x halo width
halo_blur_max_ratio = 0.5
counter_min_px = 6            # enclosed loops (a, e, o, B, 0 ...) of >= 6 px after a 1 px erosion
counter_diff_max = 16
counter_open_min = 0.9
glow_px = 4
glow_alpha = 0.25             # light text on imagery: glow in the entity colour only
glow_colour = "entity"
ladder_order = "ink_first"    # escalation: darker ink to ink_l_min, then the paper knock-back vignette
polarity_fallback = false     # paper keeps dark ink, imagery keeps light text
lc_heading = 60
lc_note = 75
shadow_dy_px = 2
shadow_blur_px = 4
shadow_alpha = 0.35
shadow_colour = "#2a1c12"
vignette_scale = 1.4
vignette_feather = 0.6         # knock-back vignette (paper colour) behind ink that misses its target
vignette_alpha_min = 0.10
vignette_alpha_max = 0.22
vignette_steps = 3
hold_frames = 8
crossfade_ms = 150
ema_tau_ms = 250
basemap_chroma = 0.88         # imagery maps; paper maps take [print] grade_saturate
entity_fill_alpha = 0.20       # region fill (multiplied into paper maps; brand .20-.35, analysis .20-.24)
entity_outline_px = 2.25
pin_outline_px = 2.5
paper_colour = "#f1e8d4"
route_casing_px = 1.75
route_casing_colour = "#2a1c12"
