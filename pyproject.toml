[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-engine"
version = "0.1.0"
description = "Universal hybrid video engine: native Rust/FFmpeg path + HyperFrames motion graphics, zero-render pre-flight gates"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12", "numpy", "pillow", "httpx"]

[project.optional-dependencies]
gemini = ["google-genai"]              # only for `--provider gemini`
test = ["pytest"]                      # provider tests use a fake client; they do not install google-genai

[project.scripts]
engine = "video_engine.cli:main"

[tool.setuptools.packages.find]
include = ["video_engine*"]

[tool.setuptools.package-data]
video_engine = ["template/*", "hf/*.mjs", "hf/*.js", "hf/*.html", "director/*.toml", "director/*.md", "director/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 200          # long lines by convention; the file you edit sets the practical width

[tool.ruff.lint]
# The enforced set (CI `lint` job): syntax errors, undefined names, unused imports and variables.
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
