# Canonical Style-Sheet Template for rea-video Aggregation.
# This file serves as the intermediate aggregation schema produced from breakdown.json metrics
# before compiling values into profiles/<channel>.toml via tools/rea-style/profile-builder.py.
description = "Geoverum: map-led geography shorts"

[storyboard]
sequence = ["paradox_hook", "spatial_context", "historical_or_causal_mechanism", "quantified_proof", "twist_ending"]

[timing]
shot_median_s = 12.0
min_seg_s = 3.0
max_seg_s = 20.0
cut_on_beat = false
moving_frames_pct = 98.5
max_hold_s = 0.90

[caption]
font = "Inter"
bold = true
size = 84
primary_color = "#FFFFFF"
outline_px = 0
soft_shadow = true
position = "bottom"
fixed_y = 1417
max_bottom_y = 1480
max_words = 3
active_word_highlight = true

[camera]
max_zoom = 16
drift_per_s = 0.06
pulse_zoom = 0.18
pulse_s = 0.85
pulse_gap_s = 0.45
bank_roll = 12
bank_tilt = 9

[theme]
route_colour = "#FFD417"
pin_colour = "#C4302A"
label_box_colour = "#18181C"
region_fill_opacity = 0.45
region_edge = "glow"
region_edge_px = 4
region_glow_px = 18

[audio]
target_lufs = -14.0
true_peak = -1.5
bpm_min = 90
bpm_max = 128
voice = "real"
music_source = "library"

[assets]
must_be_original = ["satellite_basemap", "archival_map", "cross_section_diagram"]
